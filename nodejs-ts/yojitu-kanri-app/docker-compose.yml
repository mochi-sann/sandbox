services:
  postgres:
    image: postgres:16
    container_name: yojitu-kanri-postgres
    environment:
      POSTGRES_USER: yojitu
      POSTGRES_PASSWORD: yojitu
      POSTGRES_DB: yojitu_kanri
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yojitu -d yojitu_kanri"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
